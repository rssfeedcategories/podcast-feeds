name: Update Podcast Feeds

on:
  schedule:
    - cron: '*/15 * * * *'   # Every 15 minutes - incremental
    - cron: '0 3 * * *'      # Every day at 3am UTC - full rebuild
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: false
        default: 'incremental'
        type: choice
        options:
          - incremental
          - full

jobs:
  update-feeds:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests openpyxl

      - name: Run incremental update (every 15 min)
        if: github.event_name == 'schedule' && github.event.schedule == '*/15 * * * *'
        run: python generate_category_feeds.py --incremental

      - name: Run full rebuild (daily 3am)
        if: github.event_name == 'schedule' && github.event.schedule == '0 3 * * *'
        run: python generate_category_feeds.py --full

      - name: Run manual trigger
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.mode }}" = "full" ]; then
            python generate_category_feeds.py --full
          else
            python generate_category_feeds.py --incremental
          fi

      - name: Commit and push ONLY if feeds changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output_feeds/ checkpoint.json
          if git diff --staged --quiet; then
            echo "No changes — skipping commit."
          else
            CHANGED=$(git diff --staged --name-only | wc -l)
            git commit -m "Feed update - $CHANGED file(s) $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
            echo "Pushed!"
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # Havineini app: rebuild its episode list right after the feeds changed
      # (GitHub's own timer on havineini-site is not reliable). Uses the
      # HAVINEINI_TRIGGER_TOKEN secret, which can only start that rebuild.
      # If it fails, these feeds are not affected.
      - name: Tell havineini-site to rebuild the app episode list
        if: steps.commit.outputs.pushed == 'true'
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.HAVINEINI_TRIGGER_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "No HAVINEINI_TRIGGER_TOKEN secret - skipped."; exit 0; fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/rssfeedcategories/havineini-site/actions/workflows/build.yml/dispatches \
            -d '{"ref":"main"}' && echo "havineini-site rebuild started." 
